# Publish @nilvn/plugins to npm when a plugins-v* tag is pushed.
# Needs the NPM_TOKEN secret (an npm automation token for the @nilvn scope).
# The tag must equal the package version (checked below), which
# `pnpm version:set plugins x.y.z` maintains.
name: Publish

on:
  push:
    tags: ['plugins-v*']

# contents:read to check out; id-token:write so pnpm can publish through npm's
# trusted publishing (OIDC) once each package lists this repository + workflow
# as a trusted publisher on npmjs.com — no token and no one-time code needed.
# NPM_TOKEN stays as the fallback for a package that is not set up yet.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Tag must match the package version
        run: |
          v="$(node -p "require('./packages/plugins/package.json').version")"
          test "plugins-v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package version $v"; exit 1; }

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:smoke

      # `prepack` rebuilds the package; --no-git-checks because the tag ref is
      # detached. A version already on npm (published by hand) is skipped.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v="$(node -p "require('./packages/plugins/package.json').version")"
          if npm view "@nilvn/plugins@$v" version >/dev/null 2>&1; then
            echo "@nilvn/plugins@$v is already on npm — skipping"
          else
            pnpm --filter @nilvn/plugins publish --access public --no-git-checks
          fi
