<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NilVN Demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0b0d16;
        color: #9aa1b9;
        font-family: system-ui, sans-serif;
      }
      #app {
        width: min(96vw, 168vh);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);

        font-size: 13px;
        letter-spacing: 0.08em;

  <body>
    <div id="app"></div>
    <div class="hint">Click / Space / Enter to advance · click while typing to skip ahead</div>
    <script type="module" src="/main.ts"></script>

</html>
